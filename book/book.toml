[book]
authors = ["pi-rs contributors"]
language = "en"
multilingual = false
src = "src"
title = "pi-rs Documentation"
description = "A minimal, Pi-inspired coding-agent runtime implemented in Rust."

[output.html]
git-repository-url = "https://github.com/SaehwanPark/pi-rs"
edit-url-template = "https://github.com/SaehwanPark/pi-rs/edit/main/book/src/{path}"
site-url = "/pi-rs/"
default-theme = "coal"
preferred-dark-theme = "coal"
mathjax-support = false
copy-js = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
