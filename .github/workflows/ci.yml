name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all --check
      - name: Node extension host runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Verify Node extension host runtime
        run: node --version
      - name: core contracts compile independently
        run: cargo check -p pi-rs-core --all-features
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: docs
        run: cargo doc --workspace --no-deps
      - name: startup benchmark
        run: bench/startup.sh --json bench/results/startup-ci.json
