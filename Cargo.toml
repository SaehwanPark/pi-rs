[workspace]
resolver = "3"
members = [
  "crates/pi-rs-core",
  "crates/pi-rs-store",
  "crates/pi-rs-provider",
  "crates/pi-rs-tools",
  "crates/pi-rs-compat",
  "crates/pi-rs-runtime",
  "crates/pi-rs-tui",
  "crates/pi-rs-mcp",
  "crates/pi-rs-rkb",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/saehwan/pi-rs"
authors = ["pi-rs contributors"]

[workspace.dependencies]
pi-rs-core = { path = "crates/pi-rs-core" }
pi-rs-store = { path = "crates/pi-rs-store" }
pi-rs-provider = { path = "crates/pi-rs-provider" }
pi-rs-tools = { path = "crates/pi-rs-tools" }
pi-rs-compat = { path = "crates/pi-rs-compat" }
pi-rs-runtime = { path = "crates/pi-rs-runtime" }
pi-rs-tui = { path = "crates/pi-rs-tui" }
pi-rs-mcp = { path = "crates/pi-rs-mcp" }
pi-rs-rkb = { path = "crates/pi-rs-rkb" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
getrandom = "0.3"
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
tempfile = "3"
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
libc = "0.2"

[package]
name = "pi-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
pi-rs-core.workspace = true
pi-rs-store.workspace = true
pi-rs-provider.workspace = true
pi-rs-tools.workspace = true
pi-rs-compat.workspace = true
pi-rs-runtime.workspace = true
pi-rs-tui.workspace = true
pi-rs-mcp.workspace = true
pi-rs-rkb.workspace = true
crossterm.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
