[workspace]
resolver = "3"
members = [
  "crates/rupi-core",
  "crates/rupi-store",
  "crates/rupi-provider",
  "crates/rupi-tools",
  "crates/rupi-compat",
  "crates/rupi-runtime",
  "crates/rupi-tui",
  "crates/rupi-mcp",
  "crates/rupi-rkb",
  "crates/rupi-extension",
  "crates/rupi-replay",
  "crates/rupi-experiments",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/SaehwanPark/rupi"
authors = ["rupi contributors"]

[workspace.dependencies]
rupi-core = { path = "crates/rupi-core" }
rupi-store = { path = "crates/rupi-store" }
rupi-provider = { path = "crates/rupi-provider" }
rupi-tools = { path = "crates/rupi-tools" }
rupi-compat = { path = "crates/rupi-compat" }
rupi-runtime = { path = "crates/rupi-runtime" }
rupi-tui = { path = "crates/rupi-tui" }
rupi-mcp = { path = "crates/rupi-mcp" }
rupi-rkb = { path = "crates/rupi-rkb" }
rupi-extension = { path = "crates/rupi-extension" }
rupi-replay = { path = "crates/rupi-replay" }
rupi-experiments = { path = "crates/rupi-experiments" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
fs4 = { version = "0.6.6", default-features = false, features = ["sync"] }
getrandom = "0.3"
rustix = { version = "0.38.44", default-features = false, features = ["process"] }
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
tempfile = "3"
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
libc = "0.2"

[package]
name = "rupi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rupi-core.workspace = true
rupi-store.workspace = true
rupi-provider.workspace = true
rupi-tools.workspace = true
rupi-compat.workspace = true
rupi-runtime.workspace = true
rupi-tui.workspace = true
rupi-mcp.workspace = true
rupi-rkb.workspace = true
rupi-extension.workspace = true
rupi-replay.workspace = true
rupi-experiments.workspace = true
crossterm.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
